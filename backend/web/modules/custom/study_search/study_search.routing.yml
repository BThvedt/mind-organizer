study_search.search:
  path: '/api/study/search'
  defaults:
    _controller: '\Drupal\study_search\Controller\SearchController::search'
    _title: 'Search'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _auth:
      - oauth2
      - cookie
  methods: [GET]

study_search.note_position:
  path: '/api/study/notes/{uuid}/position'
  defaults:
    _controller: '\Drupal\study_search\Controller\NotePositionController::position'
    _title: 'Note position'
  requirements:
    _user_is_logged_in: 'TRUE'
    uuid: '[0-9a-fA-F-]{36}'
  options:
    _auth:
      - oauth2
      - cookie
  methods: [GET]
